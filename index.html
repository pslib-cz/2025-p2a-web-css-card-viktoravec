<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSCard-Marketer</title>
    <link rel="icon" type="image/vnd.microsoft.icon" href="https://www.prumyslovkaliberec.cz/favicon.ico">
    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <main class="main">
        <figure class="card card--marketer">
            <header class="figure__header">
                <p class="figure__name">Marketer+</p>
                <p><span class="figure__name__important">Pokročilé funkce</span> vhodné zejména pro<br> e-shopy. E-mailing založený na datech.</p>
            </header>
            <main class="figure__main">
                <p class="figure__main__monthly" ><span class="figure__main__price">200 Kč</span> měsíčně</p>
                <p class="figure__main__smaller">nebo 300 Kč při <a class="figure__main__smaller__info" href="#">měsíční platbě</a></p>
                <a class="button button--green" href="#">Vyzkoušet zdarma</a>
            </main>
            <footer class="figure__footer">
                <ul class="figure__list">
                    <li class="figure__list__check"><span class="figure__name__important">Neomezené množství e-mailů</span></li>
                    <li class="figure__list__check">Drag&drop editor na tvorbu šablon</li>
                    <li class="figure__list__check">170+ designových šablon</li>
                    <li class="figure__list__check">AI generování předmětu a úpravy textů</li>
                    <li class="figure__list__check">Integrace s e-shopy</li>
                    <li class="figure__list__cross">Slevové kupóny</li>
                    <li class="figure__list__cross">Automatizace podle chování zákazníka</li>
                </ul>
            </footer>
        </figure>
    </main>
</body>
</html>
