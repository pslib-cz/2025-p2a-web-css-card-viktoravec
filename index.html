<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSSCard-Marketer</title>
    <link rel="icon" type="image/vnd.microsoft.icon" href="https://www.prumyslovkaliberec.cz/favicon.ico">
    <link rel="stylesheet" href="./style/main.css">
</head>
<body>
    <main class="main">

        <figure class="card card--marketer">
            <header class="figure__header">
                <p class="figure__name">Marketer+</p>
                <p><span class="figure__important">Pokročilé funkce</span> vhodné zejména pro<br> e-shopy. E-mailing založený na datech.</p>
            </header>
            <main class="figure__main">
                <p class="figure__main__monthly" ><span class="figure__main__price">200 Kč</span> měsíčně</p>
                <p class="figure__main__smaller">nebo 300 Kč při <a class="figure__main__smaller__info" href="#">měsíční platbě</a></p>
                <a class="button button--more" href="#">Vyzkoušet zdarma</a>
            </main>
            <footer class="figure__footer">
                <ul class="figure__list">
                    <li class="figure__list__check"><span class="figure__name__important">Neomezené množství e-mailů</span></li>
                    <li class="figure__list__check">Drag&drop editor na tvorbu šablon</li>
                    <li class="figure__list__check">170+ designových šablon</li>
                    <li class="figure__list__check">AI generování předmětu a úpravy textů</li>
                    <li class="figure__list__check">Integrace s e-shopy</li>
                    <li class="figure__list__cross">Slevové kupóny</li>
                    <li class="figure__list__cross">Automatizace podle chování zákazníka</li>
                </ul>
            </footer>
        </figure>

        <figure class="card card--premium">
            <header class="figure__header">
                <p class="figure__name">PREMIUM</p>
                <p class="figure__info">až pro 1500 faktur</p>
                <p class="figure__main__smaller">480 Kč měsíčně</p>
            </header>
            <main class="figure__main">
                <p class="figure__params figure__params--top">Vše, co má Základní tarif</p>
                <p class="figure__params figure__params--top">Přiznání k DPH a daní z příjmu</p>
                <p class="figure__params figure__params--top">Vedení pokladny</p>
                <p class="figure__params figure__params--bottom">Hlídání nákladů</p>
            </main>
            <footer class="figure__footer">
                <a class="button button--more" href="#">více informací</a>
            </footer>
        </figure>

        <figure class="card card--business">
            <header class="figure__header">
                <p class="figure__name">Business</p>
                <p class="figure__info">PLAN</p>
            </header>
            <main class="figure__main">
                <p class="figure__main__price">$125</p>
                <p class="fiigure__main__monthly">per month</p>
            </main>
            <footer class="figure__footer">
                <p class="figure__footer__info">Great for personal use by beginners,<br>
                small business, marketers, designers.</p>
                <a class="button button--more" href="#">Buy</a>
            </footer>
        </figure>

        <figure class="card card--zero">
            <header class="figure__header">
                <p class="figure__name">Price list</p>
                <p class="figure__info">Claim, motto, other sentences</p>
            </header>
            <main class="figure__main">
                <p class="figure__main__price">€ zero</p>
                <p class="figure__params">Other good features of this service</p>
                <p class="figure__params">It is worth mentioning all the important ones</p>
                <p class="figure__params">It is a accurate text</p>
                <p class="figure__params">Other claim</p>
            </main>
            <footer class="figure__footer">
                <a class="button button--more" href="">Make a deal!</a>
            </footer>
        </figure>

        <figure class="card card--profi">
            <header class="figure__header">
                <p class="figure__name">NEJOBLÍBENĚJŠÍ</p>
                <p class="figure__info">Profesionál</p>
                <p class="figure__price">890 Kč</p>
            </header>
            <main class="figure__main">
                <ul class="figure__list">
                    <li class="figure__list__check">Neomezené faktury</li>
                    <li class="figure__list__check">Pokročilé reporty</li>
                    <li class="figure__list__check">API přístup</li>
                    <li class="figure__list__check">Prioritní podpora</li>
                </ul>
            </main>
            <footer class="figure__footer">
                <a class="button--more" href="#">Vybrat plán</a>
            </footer>
        </figure>

        <figure class="card card--exe">
            <header class="figure__header">
                <p class="figure__name">Executive</p>
                <p class="figure__info">For growing teams</p>
            </header>
            <main class="figure__main">
                <article class="figure__box">
                <p class="figure__price">€349</p>
                <p class="figure__main__smaller">per month</p>
                </article>
            </main>
            <footer class="figure__footer">
                <ul class="figure__list">
                    <li class="figure__list__check">Unlimited invoices</li>
                    <li class="figure__list__check">Advanced analytics</li>
                    <li class="figure__list__check">Custom branding</li>
                    <li class="figure__list__check">24/7 support</li>
                </ul>
                <a class="button button--more" href="#">Get Started</a>
            </footer>
        </figure>

        <figure class="card card--enter">
            <header class="figure__header">
                <p class="figure__name">Enterprise</p>
                <p class="figure__info">Pro velké organizace</p>
            </header>
            <main class="figure__main">
                <article class="figure__box">
                    <p class="figure__main__smaller">Od</p>
                    <p class="figure__price">2 499 Kč</p>
                </article>
                <section class="figure__important">
                    <p class="figure__main__monthly">UŽIVATELŮ<br><span class="figure__infinity">∞</span></p>
                    <p class="figure__main__monthly">FAKTUR<br><span class="figure__infinity">∞</span></p>
                </section>
            </main>
            <footer class="figure__footer">
                <a class="button button--more" href="#">Kontaktujte nás</a>
            </footer>
        </figure>
    </main>
</body>
</html>
